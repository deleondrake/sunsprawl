    <noscript><h1>Walktober: Roots, Removal, Renewal: Japanese Americans in Pasadena</h1><p>Fri Oct 30 · 9:30 am · Pasadena</p><p>A walking pilgrimage to remember Japanese Americans who were removed from the city and neighboring areas in May 1942. This one-hour walk led by local author Naomi Hirahara will be a meditative one on the forced removal of Japanese Americans from Pasadena during World War II. Guest speakers will share their expertise and family experiences in &quot;camp&quot; and the group will visit the Pasadena site where people of Japanese ancestry had to report before being rounded up into Tulare Assembly Center and on to concentration camps such as Gila River in Southern Arizona. There also will be stops to…</p><p><a href="https://www.cityofpasadena.net/event/walktober-roots-removal-renewal-japanese-americans-in-pasadena/">Info on City of Pasadena</a></p></noscript>
