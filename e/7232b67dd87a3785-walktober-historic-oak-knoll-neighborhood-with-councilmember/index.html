    <noscript><h1>Walktober: Historic Oak Knoll Neighborhood with Councilmember Jason Lyon</h1><p>Sat Oct 10 · 2 pm · Pasadena</p><p>Join us for a very special walk in the Historic Oak knoll neighborhood. The walk will start at the Langham Huntington Hotel where we will be treated to a history tour. Afterwards we will be met by Jennifer Trotoux, the Gamble House Director of Collections and Interpretation, who will lead us on a guided tour of the many architecturally significant homes in the Oak Knoll neighborhood. Please register in advance. This tour will be strictly limited to 20 people.</p><p><a href="https://www.cityofpasadena.net/event/walktober-historic-oak-knoll-neighborhood-with-councilmember-jason-lyon/">Info on City of Pasadena</a></p></noscript>
