    <noscript><h1>Walktober: Pasadena&#x27;s Sacred Spaces</h1><p>Sun Oct 25 · 12:30 pm · Pasadena</p><p>Let&#x27;s walk to 10 Churches in and around Downtown Pasadena and see as many interiors as possible. If you&#x27;ve looked around, you&#x27;ve no doubt noticed that Pasadena has a lot of beautiful, old churches. Haven&#x27;t you wondered about their history, their architecture, and what they look like inside? Join walk leader, Noel McCarthy, for &quot;Sacred Spaces,&quot; a 3-mile walk around Pasadena&#x27;s central core. We&#x27;ll visit 10 churches and talk briefly about the history and architecture of each. We&#x27;ll go inside as many as we are allowed to enter with the time permitting.</p><p><a href="https://www.cityofpasadena.net/event/walktober-pasadenas-sacred-spaces/">Info on City of Pasadena</a></p></noscript>
