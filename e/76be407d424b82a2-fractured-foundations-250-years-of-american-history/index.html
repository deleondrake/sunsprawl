    <noscript><h1>Fractured Foundations: 250 Years of American History</h1><p>Jun 27–Nov 29 · American Museum of Ceramic Art, Pomona</p><p>The American Museum of Ceramic Art (AMOCA) is proud to announce Fractured Foundations: 250 Years of American History. AMOCA’s exhibition Fractured Foundations coincides with the 250th anniversary of the founding of the United States. For this exhibition, AMOCA invited ceramic artists to reconsider a historical event through the lens of contemporary art, challenging historical narratives and offering a more accurate perspective on our country. The work selected for this exhibition demonstrates resilience, injustice, triumph, and the impact of federal, state, and/or local policies, while also…</p><p><a href="https://www.amoca.org/future-exhibitions/fractured_foundations/">Tickets on Discover Los Angeles</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/06/27/fractured-foundations-250-years-of-american-history">Info on Discover Los Angeles</a></p></noscript>
