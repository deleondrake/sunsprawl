    <noscript><h1>Branching Out Open Art Studio</h1><p>Sat Oct 10 · 10 am · ARTree Community Arts Center, Santa Clarita</p><p>BRANCHING OUT OPEN ART STUDIO Second Saturday of Every Month Branching Out Open Studio is a free, monthly event held on the second Saturday of the month from 10 a.m. to 11:30 a.m., for kids aged 10-14. Branching Out Open Studio empowers youth to freely explore materials, express themselves, and build confidence through creative choice-making. Rather than providing formal instruction, a facilitator will be present to encourage exploration and create an environment where youth can build confidence and express themselves through self-directed art making.</p><p><a href="https://calendar.santaclarita.gov/event/branching-out-open-art-studio">Info on City of Santa Clarita calendar</a></p></noscript>
