    <noscript><h1>Orianthi</h1><p>Fri Oct 30 · 9 pm · The Canyon Agoura Hills, Agoura Hills</p><p>Blues rock guitar virtuoso Orianthi wanted to create something special to celebrate her 25 th anniversary as a professional musician. The Australian-born, Los Angeles-based Orianthi entered The Doors guitarist Robby Krieger’s Love Street Sound studio where she wrote, produced and recorded her debut single for Woodward Avenue Records, “First Time Blues.” Orianthi has been performing “First Time Blues” in concert with her band for the past year and was able to cut it live in the studio in just a few takes. She burns up “First Time Blues” with her impassioned vocals and blazing guitar licks…</p><p><a href="https://www.axs.com/events/1335673/orianthi-tickets">Tickets on AXS</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/30/orianthi">Info on Discover Los Angeles</a></p></noscript>
