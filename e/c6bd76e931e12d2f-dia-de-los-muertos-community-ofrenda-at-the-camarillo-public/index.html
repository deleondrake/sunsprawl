    <noscript><h1>Día de los Muertos Community Ofrenda at the Camarillo Public Library</h1><p>Oct 12–Nov 2 · Camarillo Public Library, Camarillo</p><p>Día de los Muertos (Day of the Dead) is a celebration to remember family and friends who have passed away. Join us in creating a community ofrenda , which is an offering place to remember past loved ones. Bring in copies of pictures to the 2nd Floor Reference Desk between October 12 and November 1. The ofrenda will be on display in the lobby through November 3. Copies preferred since we cannot guarantee original pictures will be returned.</p><p><a href="https://camarillolibrary.libcal.com/event/17088494">Tickets on Visit Camarillo</a></p><p><a href="https://visitcamarillo.com/event/dia-de-los-muertos-community-ofrenda-at-the-camarillo-public-library/">Info on Visit Camarillo</a></p></noscript>
