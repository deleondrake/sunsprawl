    <noscript><h1>Lawndale Library Book Club — In-Person Program</h1><p>Thu Oct 8 · 11 am · Lawndale Library, Lawndale</p><p>Patrons can enjoy a facilitated discussion of fiction and nonfiction titles. A limited number of titles are available for attendees at the library. October&#x27;s Pick: Crying in H-Mart by Michelle Zauner. For ages 18+. In this exquisite story of family, food, grief, and endurance, Michelle Zauner proves herself far more than a dazzling singer, songwriter, and guitarist. Vivacious and plainspoken, lyrical and honest, Zauner&#x27;s voice is as radiantly alive on the page as it is onstage. Rich with intimate anecdotes that will resonate widely, Crying in H Mart is a book to cherish, share, and reread.</p><p><a href="https://visit.lacountylibrary.org/event/16729705">Info on LA County Library</a></p></noscript>
