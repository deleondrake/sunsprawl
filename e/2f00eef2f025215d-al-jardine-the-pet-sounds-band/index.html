    <noscript><h1>Al Jardine &amp; The Pet Sounds Band</h1><p>Thu Oct 22 · 8 pm · Valley Performing Arts Center, Northridge</p><p>Al Jardine &amp; The Pet Sounds Band The Music of Brian Wilson and The Beach Boys Pet Sounds and Love You Thu Oct 22 | 8PM The Beach Boys founder Al Jardine gathers the Pet Sounds Band to share the best of band co-founder Brian Wilson. Wilson, who died in June 2025, was often called the soul of The Beach Boys’ sound and was responsible for the melodies and lyrics of many of their songs, creating the soundtrack for millions around the world. “Together, we gave the world the American dream of optimism, joy, and a sense of freedom,” the band said on Wilson’s passing. Come sing along with friends…</p><p><a href="https://thesoraya.org/whats-on/en/al-jardine-the-pet-sounds-band/?utm_medium=website&amp;utm_source=eventlisting_soraya&amp;utm_campaign=marketing&amp;utm_content=aljardine&amp;utm_keyword=presented">Tickets on Discover Los Angeles</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/22/al-jardine-the-pet-sounds-band">Info on Discover Los Angeles</a></p></noscript>
