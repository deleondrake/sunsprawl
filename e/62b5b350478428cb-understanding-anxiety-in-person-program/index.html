    <noscript><h1>Understanding Anxiety 認識焦慮 — In-Person Program</h1><p>Tue Oct 20 · 4 pm · Rowland Heights Library, Rowland Heights</p><p>LA County Department of Mental Health Promoters Workshops cover a range of mental health topics to help Angelenos understand and manage their mental health. 洛杉磯縣心理健康推廣研討會的講座涵蓋一系列心理健康主題，旨在幫助洛杉磯居民了解和管理他們的心理健康。 Join us to explore how culture shapes anxiety, distinguish worry from anxiety disorders, understand the different types of anxiety disorders, and learn strategies to reduce anxiety. For adults. 一起來探討文化如何引發焦慮，學會區分擔憂與焦慮障礙，了解不同類型的焦慮障礙，並學習緩解焦慮的方法。歡迎18歲以上的成年人參加。 English language session: 4 - 5 pm / 英文場: 下午4點至5點 Chinese language session: 5 - 6 pm / 中文場: 下午5點至6點</p><p><a href="https://visit.lacountylibrary.org/event/17474497">Info on LA County Library</a></p></noscript>
