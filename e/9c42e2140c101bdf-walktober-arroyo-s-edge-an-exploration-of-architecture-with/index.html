    <noscript><h1>Walktober: Arroyo&#x27;s Edge - An Exploration of Architecture with Nature as Inspiration</h1><p>Sun Oct 25 · 9 am · Pasadena</p><p>Join the Gamble House and the One Arroyo Foundation for a walk focused on the Arroyo&#x27;s architectural history and natural beauty. The Gamble House is pleased to participate in WALKTOBER PASADENA, the 9th Annual Celebration of Walking in Pasadena! Join us for a guided two-part walk through the Arroyo Terrace neighborhood, exploring the remarkable architecture, history, and ecology of this unique setting. Led by a Gamble House docent, the first half of the walk will explore the National Register Historic District, home to nine Greene &amp; Greene houses whose location, design, and materials reflect…</p><p><a href="https://www.cityofpasadena.net/event/walktober-arroyos-edge-an-exploration-of-architecture-with-nature-as-inspiration/">Info on City of Pasadena</a></p></noscript>
