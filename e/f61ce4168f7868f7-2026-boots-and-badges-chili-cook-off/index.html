    <noscript><h1>2026 Boots and Badges Chili Cook-Off</h1><p>Sat Oct 10 · 10 am · Santa Clarita</p><p>Join the Los Angeles County Sheriff’s Department and Special Olympics Southern California for the 2026 Boots &amp; Badges Chili Cook-Off on Saturday, October 10, 2026, from 10:00 a.m. to 4:00 p.m. at the Jack Bones Equestrian Center in Castaic. Enjoy a spirited chili competition, live entertainment, a Kids Zone, LASD specialty displays, local vendors, food, and family activities; all while helping raise funds and awareness for Special Olympics Southern California athletes. Bring the family, support a great cause, and be part of a fun day of community, competition, and giving back.</p><p><a href="https://calendar.santaclarita.gov/event/2026-boots-and-badges-chili-cook-off">Info on City of Santa Clarita calendar</a></p></noscript>
