    <noscript><h1>Julia Wolf</h1><p>Sun Oct 25 · 8 pm · The Fonda Theatre, Hollywood</p><p>Julia Wolf (aka WOLF) is an indie-pop singer/songwriter, born and raised in New York. A prolific lyricist with a unique and captivating tone, WOLF began releasing short freestyles and snippets of her music on social media at the end of 2019. Almost immediately she began garnering heavy buzz from both early adopter fans and industry professionals alike. In just over a year, WOLF has accumulated over 40 million streams and has developed a passionate and rabid fan base -- all out of her bedroom in Queens, NY.</p><p><a href="https://www.axs.com/events/1396837/julia-wolf-tickets">Tickets on AXS</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/25/julia-wolf">Info on Discover Los Angeles</a></p></noscript>
