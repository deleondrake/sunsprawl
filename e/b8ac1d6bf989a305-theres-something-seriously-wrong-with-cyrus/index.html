    <noscript><h1>There’s Something Seriously Wrong with Cyrus</h1><p>Sat Oct 10 · I Suck: A Vampire Comedy, San Buenaventura (Ventura)</p><p>A one-person comedy about growing up queer in an immigrant household and learning how to tell the truth without losing your sense of humor. Mark your calendars for October 10 at 7 pm. You will not want to miss this show! NAMBA&#x27;S Playwrights&#x27; SPLASH Festival. Tickets are $20 online at NambaArts.com or $25 at the door. Blending stand-up, storytelling, and pop anthems inspired by Madonna and Taylor Swift, Cyrus revisits family pressure, identity, and self-acceptance, turning personal history into a funny, disarmingly honest shared experience about finding your voice and living unapologetically.</p><p><a href="https://visitventuraca.com/event/theres-something-seriously-wrong-with-cyrus/">Info on Visit Ventura</a></p></noscript>
