    <noscript><h1>Jimmy’s Buffet A Tribute to Jimmy Buffett</h1><p>Sat Oct 10 · 3 pm · The Grand Annex Music Hall, San Pedro</p><p>Calling all Parrot Heads! Celebrate the music and vibes of – you guessed it! – Jimmy Buffett. Experience a truly authentic Buffett sound with 12 of California’s best musicians. The Grand Annex will transform into a tropical beach party as Jimmy’s Buffet honors their captain’s timeless legacy. Complete with congas and steel drums, the band will serve up a full catalog of hits, as well as a few surprises. Look forward to a Trop-Rock sensation! This show is also available on Saturday, October 17 at 8 PM.</p><p><a href="https://grandvision.org/event/jimmys-buffet-2026-3pm/">Tickets on Discover Los Angeles</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/10/jimmy%E2%80%99s-buffet-a-tribute-to-jimmy-buffett">Info on Discover Los Angeles</a></p></noscript>
