    <noscript><h1>Tours of the Camarillo Bird Museum</h1><p>Wed Oct 14 · 10 am · WFVZ Bird Museum and Research Center, Camarillo</p><p>Tuesday – Friday, 10am – 3pm, Guided Tours (groups of 5 or more) and Self-guided Visits Saturday, 10am – 2pm, Self-guided Visits Only* Discover the fascinating world of birds at the Western Foundation of Vertebrate Zoology, also known as the Camarillo Bird Museum! Explore some of the world’s largest collection of eggs, nests and other specimens while learning about bird species, habitats, and the research that helps advance our understanding of avian life. Whether you’re a bird enthusiast or simply curious, a tour offers a closer look at the beauty, diversity, and science of the bird world.</p><p><a href="https://wfvz.org/public-tour/?v=0b3b97fa6688">Tickets on Visit Camarillo</a></p><p><a href="https://visitcamarillo.com/event/tours-of-the-camarillo-bird-museum/2026-10-14/">Info on Visit Camarillo</a></p></noscript>
