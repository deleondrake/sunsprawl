    <noscript><h1>Jupiter Symphony - What Makes It Great</h1><p>Wed Oct 7 · 7:30 pm · Cerritos Center for the Performing Arts, Cerritos</p><p>In one of music&#x27;s most astonishing feats, Mozart wrote his final three symphonies in just six weeks during the summer of 1788. Why he wrote them, or whether he ever heard them performed, remains a mystery, but the final work in the trilogy remains one of the most iconic pieces ever written. Join Rob Kapilow and the Cal State Fullerton Orchestra to explore the music and mystery behind the iconic Jupiter Symphony, one of Mozart&#x27;s and the world&#x27;s greatest masterpieces.</p><p><a href="https://www.ticketmaster.com/what-makes-it-great-jupiter-symphony-cerritos-california-10-07-2026/event/0B0064BA9FED46C2">Tickets on Ticketmaster</a></p><p><a href="https://www.axs.com/events/1482740/jupiter-symphony-what-makes-it-great-tickets">Tickets on AXS</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/07/jupiter-symphony-what-makes-it-great">Info on Discover Los Angeles</a></p></noscript>
