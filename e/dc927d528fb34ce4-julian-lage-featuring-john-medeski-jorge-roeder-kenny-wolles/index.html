    <noscript><h1>Julian Lage featuring John Medeski, Jorge Roeder, Kenny Wollesen</h1><p>Fri Oct 23 · 8 pm · John Anson Ford, Hollywood Hills</p><p>Julian Lage has long been considered one of the most creative guitarists in jazz, bringing together seemingly incompatible sounds: the cool, crisp world of Wes Montgomery, the skronk of downtown New York experimentalist John Zorn, and basically everything in between. On his latest album, Scenes from Above, he joins with bassist Jorge Roeder, drummer Kenny Wollesen, and vaunted keyboardist John Medeski for a set that takes inspiration from folkloric music like early calypso, American blues, and the Romanian and Hungarian tunes Béla Bartók worked into his own music. Together with his ensemble…</p><p><a href="https://bit.ly/4uHGxG7">Tickets on Discover Los Angeles</a></p><p><a href="https://www.axs.com/events/1454368/julian-lage-with-john-medeski-tickets">Tickets on AXS</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/23/julian-lage-featuring-john-medeski-jorge-roeder-kenny-wollesen">Info on Discover Los Angeles</a></p></noscript>
