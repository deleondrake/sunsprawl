    <noscript><h1>Lisa Batiashvili Gautier Capuçon Jean-Yves Thibaudet</h1><p>Wed Oct 14 · 8 pm · Walt Disney Concert Hall, Downtown LA</p><p>“Jean-Yves Thibaudet’s piano, Lisa Batiashvili’s violin and Gautier Capuçon’s cello [stitch] their individual strands of sound into a sumptuous fabric” (The Arts Desk) during a night of Russian, French, and Czech music. Join three of the Los Angeles Philharmonic’s most beloved guest soloists as they come together for a selection of expressive chamber works. Shostakovich’s trio evokes the agitated yearning of teenage romance, while Debussy’s trio brings out the “sweet, sentimental and sugared” (The New York Times) aspects of youth. Thibaudet, Batiashvili, and Capuçon close out their recital…</p><p><a href="https://bit.ly/4sPQe4e">Tickets on Discover Los Angeles</a></p><p><a href="https://www.axs.com/events/1402732/los-angeles-philharmonic-lisa-batiashvili-gautier-capucon-and-jean-yve-tickets">Tickets on AXS</a></p><p><a href="https://www.laphil.com/events/instances/pc8s9cqy/2026-10-14/lisa-batiashvili-gautier-capucon-jean-yves-thibaudet">Info on LA Phil (Walt Disney Concert Hall, Hollywood Bowl, Ford)</a></p></noscript>
