    <noscript><h1>Debussy &amp; Stravinsky with Elim Chan</h1><p>Sat Oct 24 · 2 pm · Walt Disney Concert Hall, Downtown LA</p><p>Elim Chan leads the Los Angeles Philharmonic in two enchanting and colorful orchestral favorites. Debussy’s hues in Prelude to the Afternoon of a Faun are otherworldly if hazy and in watercolor. The Impressionistic atmosphere Debussy conjures exudes a fragile beauty that set off a revolution, which Pierre Boulez said “breathed new air into the art of music.” By contrast, Stravinsky paints with bold, contrasting blocks of sound. Petrushka’s Picasso-esque approach to musical color and movement sets the stage for the story of a mischievous puppet, packed with Russian folklore and misadventure…</p><p><a href="https://bit.ly/4sVzicW">Tickets on Discover Los Angeles</a></p><p><a href="https://www.axs.com/events/1402711/los-angeles-philharmonic-debussy-and-stravinsky-with-elim-chan-tickets">Tickets on AXS</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/24/debussy-stravinsky-with-elim-chan">Info on Discover Los Angeles</a></p></noscript>
