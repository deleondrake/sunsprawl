    <noscript><h1>Book Club for Adults — In-Person Program</h1><p>Sat Oct 31 · 11 am · Lynwood Library, Lynwood</p><p>Montserrat, a talented sound editor in 1990s Mexico City, is secretly in love with her best friend, faded soap star Tristán. When they meet cursed horror director Abel Urueta, he convinces them to help complete a mysterious unfinished film involving occult magic and Nazi sorcery. But as they investigate, Montserrat is haunted by a dark presence and Tristán sees his dead ex-girlfriend. Together, they must uncover the film’s supernatural secrets before the curse consumes them. Join us for a discussion of Silver Nitrate, by Silvia Moreno-Garcia. Copies of the book are available at the library…</p><p><a href="https://visit.lacountylibrary.org/event/17482481">Info on LA County Library</a></p></noscript>
