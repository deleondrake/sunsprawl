    <noscript><h1>Stop, Drop, + Pose: Clay in Motion</h1><p>Jun 13–Dec 20 · American Museum of Ceramic Art, Pomona</p><p>Stop, Drop, + Pose: Clay in Motion traces the evolution of clay as a time-based medium, from one of the earliest efforts in The Sculptor’s Nightmare (1908) to early television and experimental theater, to contemporary artists pushing the material into new territories of video, performance, and moving image. While early animation popularized clay’s elasticity, today’s artists investigate its fragility, resistance, and intimacy. Stop, Drop ,+ Pose: Clay in Motion is on view in the Igal &amp; Diane Silber Vault Gallery at AMOCA from June 13–December 20, 2026.</p><p><a href="https://www.amoca.org/in-the-vault/clay-in-motion/">Tickets on Discover Los Angeles</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/06/13/stop-drop-pose-clay-in-motion">Info on Discover Los Angeles</a></p></noscript>
