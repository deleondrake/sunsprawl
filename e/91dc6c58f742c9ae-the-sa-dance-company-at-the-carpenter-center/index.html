    <noscript><h1>The Sa Dance Company at the Carpenter Center</h1><p>Sat Oct 24 · 8 pm · Carpenter Center, East Long Beach</p><p>Celebrate the power, resilience, and spirit of womanhood in RISE, an immersive Indian American dance experience told in four movements. Follow the journey of an Indian woman—her youthful dreams, the weight of societal expectations, the strength to overcome adversity, and the hope that emerges through faith and sisterhood. A celebration of courage, transformation, and the unbreakable bond that unites us all, RISE pays tribute to the generations of grandmothers, aunties, and mothers whose unwavering determination and boundless generosity have paved the way for the women of today.</p><p><a href="https://www.carpenterarts.org/event/sa-dance-company">Tickets on Discover Los Angeles</a></p><p><a href="https://www.visitlongbeach.com/events/the-sa-dance-company-at-the-carpenter-center/">Info on Visit Long Beach</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/10/24/sa-dance-company-an-indian-american-dance-experience-rise">Info on Discover Los Angeles</a></p></noscript>
