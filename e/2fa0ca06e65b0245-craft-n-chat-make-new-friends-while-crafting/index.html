    <noscript><h1>Craft &#x27;n Chat — Make new friends while crafting!</h1><p>Fri Oct 16 · 6 pm · Buena Vista Branch Library, Burbank</p><p>Come for the crafts, stay for your new best friend! Have you ever thought about how hard it is to make friends as an adult? You are not alone, but the Burbank Library is here to help and what better way than with the shared interest of crafting! We will provide soft music, snacks, and conversation starters to help break the ice. We will also have a craft ready for you to learn, but please feel free to bring your own craft to work on. There’s no pressure to do the exact same crafts, we’re all here to make friends! We can&#x27;t wait to craft &#x27;n chat with you!</p><p><a href="https://burbank.libnet.info/event/17492642">Info on Burbank Public Library</a></p></noscript>
