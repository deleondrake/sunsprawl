    <noscript><h1>Walktober: Pasadena Gardens and Historic Homes</h1><p>Sun Oct 18 · 9 am · Pasadena</p><p>A loop with two public gardens, walking by historic homes built as early as 1891, and an interesting piece of public art. Please join your fellow walking enthusiasts for a 3.25-mile loop which includes visiting two public gardens, walking by historic homes built as early as 1891, and an interesting piece of public art. This will include a tour of the community-built Arlington Garden, a water-wise, mediterranean style garden. Arlington Garden was included in the LA Times Article “26 awe-inspiring gardens in Southern California you must visit at least once.” (5/20/25) We will explore…</p><p><a href="https://www.cityofpasadena.net/event/walktober-pasadena-gardens-and-historic-homes/">Info on City of Pasadena</a></p></noscript>
