    <noscript><h1>Adopt a Shelter Pet and Read to Rover — Pet Adoption</h1><p>Fri Oct 16 · 2 pm · Carson Library, Carson</p><p>LA County Library has partnered with Animal Care &amp; Control to host pet adoptions in celebration of Adopt a Shelter Dog Month. Attend the adoption clinic and if you read a book to any dog, you&#x27;ll have your adoption fee waived, including spay/neuter and microchip*. There&#x27;s a license fee of $20 for all pets, but seniors pay only $7.50 and it is free for military (bring your ID!) *Must be at least 18 years old and provide a current photo ID with proof of your current LA County address.</p><p><a href="https://visit.lacountylibrary.org/event/17521222">Info on LA County Library</a></p></noscript>
