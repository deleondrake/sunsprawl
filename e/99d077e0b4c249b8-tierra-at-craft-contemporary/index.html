    <noscript><h1>tierra at Craft Contemporary</h1><p>May 31–Oct 25 · Craft Contemporary, Miracle Mile</p><p>On view May 31 – October 25, 2026, Craft Contemporary’s 4th Clay Biennial tierra reconsiders the biennial’s scope by expanding its focus beyond ceramic and clay as a singular medium to encompass broader practices grounded in land and earth. The fourteen featured artists work with earth-based materials as something more than physical substances, treating them as carriers of history shaped by the people who have worked, lived on, and been displaced from the land. tierra asks what it means to truly know a place, and how that knowledge gets passed down through the things we make with our hands…</p><p><a href="https://www.craftcontemporary.org/">Tickets on Discover Los Angeles</a></p><p><a href="https://www.discoverlosangeles.com/event/2026/05/31/tierra-at-craft-contemporary">Info on Discover Los Angeles</a></p></noscript>
